<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5b57ff">
  <title>DIVIDUAL — Recover Your Voice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@300..900&display=swap" />
<link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="core.js"></script>
</head>
<body class="visitor-page"><div class="stage"><div class="phone">
  <header class="site-header"><div class="wrap">
    <a class="brand" href="index.html" aria-label="Dividual home"><div class="mark" aria-hidden="true"><svg viewBox="0 0 120 120"><g fill="currentColor" transform="translate(60 60)"><rect x="-10" y="-52" width="20" height="42" rx="6"/><rect x="-10" y="10" width="20" height="42" rx="6" transform="rotate(180)"/><rect x="-10" y="10" width="20" height="42" rx="6" transform="rotate(60)"/><rect x="-10" y="10" width="20" height="42" rx="6" transform="rotate(120)"/><rect x="-10" y="10" width="20" height="42" rx="6" transform="rotate(240)"/><rect x="-10" y="10" width="20" height="42" rx="6" transform="rotate(300)"/><circle r="7"/></g></svg></div><div class="word">Dividual<span class="tm">TM</span></div></a>
    <nav class="nav" aria-label="Main navigation"><a class="active" href="index.html">CREATE</a><a href="answers.html">READ POEMS</a></nav>
  </div></header>

  <main class="wrap">
    <div id="steps" class="steps" aria-label="Poem progress" hidden></div>
    <div id="screen" aria-live="polite"></div>
    <p class="mode-msg" id="connection"></p>
  </main>
  <footer class="footer">Dividual Systems<span class="tm">TM</span></footer>

  <script>
  (() => {
    'use strict';
    const D = window.Dividual;

    // Audio is local to the participant's phone. play() must run before fetch/await.
    const phoneAudio = {
      private: new Audio('audio/Privately.mp3'),
      public: new Audio('audio/Publicly.mp3')
    };
    Object.values(phoneAudio).forEach(sound => { sound.preload = 'auto'; });
    let phoneAudioError = '';
    let audioAttempt = 0;
    function showPhoneAudioError() {
      const node = document.getElementById('soundFeedback');
      if (node) node.textContent = phoneAudioError;
    }
    function stopPhoneAudio() {
      ++audioAttempt;
      for (const sound of Object.values(phoneAudio)) {
        sound.pause();
        try { sound.currentTime = 0; } catch { /* no seekable data yet */ }
      }
    }
    function playPhoneAudio(which) {
      stopPhoneAudio();
      const attempt = audioAttempt;
      phoneAudioError = '';
      showPhoneAudioError();
      try {
        const playback = phoneAudio[which].play();
        if (playback && typeof playback.catch === 'function') {
          playback.catch(() => {
            if (attempt !== audioAttempt) return;
            phoneAudioError = 'Audio could not play. Check your phone media volume, then tap REPLAY SOUND.';
            showPhoneAudioError();
          });
        }
      } catch {
        phoneAudioError = 'Audio could not start. Tap REPLAY SOUND to try again.';
        showPhoneAudioError();
      }
    }
    const draftKey = 'dividual_render_draft_v2';
    const screen = document.getElementById('screen');
    const steps = document.getElementById('steps');
    document.getElementById('connection').textContent = '';

    const initial = () => ({ unlocked: [false, false, false], answers: ['', '', ''], active: 0, view: 'intro', releasedId: '' });
    function load() {
      try {
        const old = JSON.parse(localStorage.getItem(draftKey) || '{}');
        if (!Array.isArray(old.unlocked) || old.unlocked.length !== 3 || !Array.isArray(old.answers) || old.answers.length !== 3) return initial();
        const view = ['intro', 'edit', 'gate', 'finish', 'private', 'released'].includes(old.view) ? old.view : 'intro';
        return { ...initial(), ...old, view };
      } catch { return initial(); }
    }
    let state = load();
    function persist() { try { localStorage.setItem(draftKey, JSON.stringify(state)); } catch { /* private mode */ } }
    function elem(tag, className, text) {
      const e = document.createElement(tag);
      if (className) e.className = className;
      if (text !== undefined) e.textContent = text;
      return e;
    }
    function showError(message) {
      const feedback = document.getElementById('feedback');
      if (feedback) { feedback.className = 'feedback error'; feedback.textContent = message; }
    }
    function renderSteps() {
      steps.replaceChildren();
      steps.hidden = !state.unlocked.some(Boolean) || state.view === 'released';
      D.config.poems.forEach((p, i) => {
        const b = elem('button', 'step' + (state.active === i && state.view === 'edit' ? ' current' : '') + (state.answers[i] ? ' done' : ''), `${i + 1}`);
        b.type = 'button';
        b.setAttribute('aria-label', `Edit part ${i + 1}`);
        b.disabled = !state.unlocked[i] || state.view === 'released';
        b.onclick = () => { state.active = i; state.view = 'edit'; persist(); render(); };
        steps.append(b);
      });
    }
    function render() {
      renderSteps();
      screen.replaceChildren();
      window.scrollTo(0, 0);
      if (state.view === 'intro') return intro();
      if (state.view === 'edit') return edit();
      if (state.view === 'gate') return gate();
      if (state.view === 'finish') return finish();
      if (state.view === 'private') return privateView();
      if (state.view === 'released') return released();
    }
    function intro() {
      screen.innerHTML = `
        <section class="intro-hero">
          <div class="eyebrow">3 PARTS · 1 POEM</div>
          <h1>Make a<br>poem<span class="accent">.</span></h1>
          <p class="lead">1. Find any code in the installation.<br>2. Fill in the blank with your own words.<br>3. Find the other two codes and repeat.</p>
        </section>
        <section class="panel padded action-card">
          <h2>Find any code</h2>
          <p class="muted">Scan the QR code, or type the code below. Any order!</p>
          <form id="codeForm">
            <label class="sr-only" for="code">Code</label>
            <div class="field-row"><input id="code" type="text" maxlength="12" placeholder="Enter code" autocapitalize="characters" autocomplete="off" spellcheck="false" required><button class="btn" type="submit">OPEN PART →</button></div>
          </form>
          <p class="feedback" id="feedback" role="status"></p>
        </section>`;
      document.getElementById('codeForm').onsubmit = event => { event.preventDefault(); unlock(document.getElementById('code').value); };
    }
    function edit() {
      const idx = state.active;
      if (!state.unlocked[idx]) { state.view = 'intro'; return render(); }
      const item = D.config.poems[idx];
      screen.innerHTML = `
        <div class="eyebrow light-label">PART ${idx + 1} OF 3</div>
        <section class="panel padded action-card">
          <h2 id="prompt"></h2>
          <p class="muted">Fill in the blank with your own words.</p>
          <div class="verse" id="verse"></div>
          <form id="answerForm">
            <label class="input-label" for="answer">YOUR WORDS</label>
            <input id="answer" type="text" maxlength="72" required autocomplete="off" placeholder="Your words here…" aria-describedby="prompt">
            <div class="actions"><button class="btn" type="submit">${state.unlocked.every(Boolean) && state.answers.every((answer, i) => i === idx || Boolean(answer)) ? 'FINISH POEM →' : 'SAVE & CONTINUE →'}</button></div>
          </form>
          <p class="feedback" id="feedback" role="status"></p>
        </section>`;
      document.getElementById('prompt').textContent = item.prompt;
      const input = document.getElementById('answer');
      const verse = document.getElementById('verse');
      input.value = state.answers[idx];
      function livePreview() { D.appendVerse(verse, item.template, input.value.trim()); }
      input.addEventListener('input', livePreview);
      livePreview();
      document.getElementById('answerForm').onsubmit = event => {
        event.preventDefault();
        const answer = input.value.trim();
        if (!answer) return showError('Write a word or short phrase first.');
        state.answers[idx] = answer;
        const firstMissing = state.answers.findIndex((value, i) => state.unlocked[i] && !value);
        const nextLocked = state.unlocked.findIndex(x => !x);
        if (state.unlocked.every(Boolean) && state.answers.every(Boolean)) state.view = 'finish';
        else if (firstMissing >= 0) { state.active = firstMissing; state.view = 'edit'; }
        else if (nextLocked >= 0) state.view = 'gate';
        else state.view = 'finish';
        persist(); render();
      };
    }
    function gate() {
      const next = state.unlocked.findIndex(x => !x);
      if (next < 0) {
        const unanswered = state.answers.findIndex(answer => !answer);
        state.active = unanswered >= 0 ? unanswered : state.active;
        state.view = unanswered >= 0 ? 'edit' : 'finish';
        return render();
      }
      const completed = state.answers.filter(Boolean).length;
      screen.innerHTML = `
        <div class="eyebrow light-label">${completed} OF 3 PARTS DONE ✓</div>
        <h1>Find the<br>next code<span class="accent">.</span></h1>
        <section class="panel padded action-card">
          <h2>Find another code</h2>
          <p class="muted">Scan the QR code, or type the code below. Any order!</p>
          <form id="codeForm">
            <label class="sr-only" for="code">Code</label>
            <div class="field-row"><input id="code" type="text" maxlength="12" placeholder="Enter code" autocapitalize="characters" autocomplete="off" spellcheck="false" required><button class="btn" type="submit">OPEN PART →</button></div>
          </form>
          <p class="feedback" id="feedback" role="status"></p>
        </section>`;
      document.getElementById('codeForm').onsubmit = event => { event.preventDefault(); unlock(document.getElementById('code').value); };
    }
    function preview(parent) { D.renderPoem(parent, state.answers); }
    function finish() {
      screen.innerHTML = `
        <div class="eyebrow light-label">3 OF 3 PARTS DONE ✓</div>
        <h1>Your poem is ready<span class="accent">.</span></h1>
        <section class="panel padded"><div id="fullPoem" class="assembled-poem"></div></section>
        <section class="finish-actions">
          <h2>Who can read your poem?</h2>
          <div class="actions"><button class="btn" id="keep" type="button">KEEP PRIVATE</button><button class="btn ghost" id="release" type="button">SHARE ANONYMOUSLY ↗</button></div>
          <p class="privacy-note">Private: only you can read it. Anonymous: everyone can read it, without your name. Sound plays on your phone.</p>
          <p class="feedback" id="feedback" role="status"></p>
          <p class="feedback" id="soundFeedback" role="status"></p>
        </section>`;
      preview(document.getElementById('fullPoem'));
      document.getElementById('keep').onclick = keepPrivate;
      document.getElementById('release').onclick = release;
    }
    function privateView() {
      screen.innerHTML = `
        <div class="eyebrow light-label">SHARED PRIVATELY ✓</div>
        <h1>Just for you<span class="accent">.</span></h1>
        <p class="lead">Your poem stays on this phone. Listen to your sound below.</p>
        <section class="panel padded"><div id="fullPoem" class="assembled-poem"></div></section>
        <div class="actions"><button class="btn" id="replaySound" type="button">▶ REPLAY SOUND</button><a class="btn ghost" href="answers.html">READ POEMS</a><button class="btn ghost" id="restart">NEW POEM</button></div><div class="phone-audio-fallback"><p class="privacy-note">No sound? Press play below.</p><div id="nativeAudio"></div></div><p class="feedback" id="soundFeedback" role="status"></p>`;
      preview(document.getElementById('fullPoem'));
      document.getElementById('restart').onclick = restart;
      document.getElementById('replaySound').onclick = () => playPhoneAudio('private');
      phoneAudio.private.controls = true;
      phoneAudio.private.setAttribute('aria-label', 'Private poem sound');
      document.getElementById('nativeAudio').append(phoneAudio.private);
      showPhoneAudioError();
    }
    function released() {
      screen.innerHTML = `
        <div class="eyebrow light-label">POEM SHARED ✓</div>
        <h1>Poem<br>shared<span class="accent">.</span></h1>
        <p class="lead">Others can now read your poem. Listen to your sound below.</p>
        <section class="panel padded voice-id-card"><div class="eyebrow">FIND YOUR POEM</div><h2 id="voiceId"></h2></section>
        <div class="actions"><button class="btn" id="replaySound" type="button">▶ REPLAY SOUND</button><a class="btn ghost" href="answers.html">READ POEMS ↗</a><button class="btn ghost" id="restart">NEW POEM</button></div><div class="phone-audio-fallback"><p class="privacy-note">No sound? Press play below.</p><div id="nativeAudio"></div></div><p class="feedback" id="soundFeedback" role="status"></p>`;
      document.getElementById('voiceId').textContent = D.voiceId(state.releasedId);
      document.getElementById('restart').onclick = restart;
      document.getElementById('replaySound').onclick = () => playPhoneAudio('public');
      phoneAudio.public.controls = true;
      phoneAudio.public.setAttribute('aria-label', 'Anonymous poem sound');
      document.getElementById('nativeAudio').append(phoneAudio.public);
      showPhoneAudioError();
    }
    function restart() {
      if (!confirm('Start a new poem? This clears the current poem from your phone. Poems shared anonymously stay in the archive.')) return;
      stopPhoneAudio();
      phoneAudioError = '';
      state = initial(); persist(); render();
    }
    function unlock(raw) {
      const code = raw.trim().toUpperCase();
      const idx = D.config.poems.findIndex(p => p.code.toUpperCase() === code);
      if (idx < 0) return showError('That code did not work. Try again.');
      // Each valid code independently unlocks its own poem part.
      if (state.view === 'released') return;
      state.unlocked[idx] = true;
      state.active = idx;
      state.view = 'edit';
      persist();
      try { history.replaceState(null, '', window.location.pathname); } catch { /* local file */ }
      render();
    }
    async function keepPrivate() {
      playPhoneAudio('private'); // User tap; synchronous before network request.
      const button = document.getElementById('keep');
      button.disabled = true;
      button.textContent = 'SHARING...';
      try {
        await D.sharePrivate();
        state.view = 'private';
        persist(); render();
      } catch (error) {
        button.disabled = false;
        button.textContent = 'KEEP PRIVATE';
        showError(`Could not keep your poem private: ${error.message}. Try again.`);
      }
    }
    async function release() {
      playPhoneAudio('public'); // User tap; synchronous before network request.
      const button = document.getElementById('release');
      button.disabled = true;
      button.textContent = 'RELEASING...';
      try {
        const poem = await D.submit(state.answers);
        state.releasedId = poem.id;
        state.view = 'released';
        persist(); render();
      } catch (error) {
        button.disabled = false; button.textContent = 'SHARE ANONYMOUSLY ↗';
        showError(`Could not share your poem: ${error.message}. Your draft is still here.`);
      }
    }
    // QR codes use index.html?code=F2/K7/D9; all three can be scanned in any order.
    const scanned = new URLSearchParams(location.search).get('code');
    if (scanned && state.view !== 'released') {
      render();
      unlock(scanned);
    } else {
      if (state.view === 'intro' && state.unlocked.some(Boolean)) {
        const unanswered = state.unlocked.findIndex((unlocked, i) => unlocked && !state.answers[i]);
        if (unanswered >= 0) { state.active = unanswered; state.view = 'edit'; }
        else state.view = 'gate';
      }
      render();
    }
  })();
  </script>
</div></div></body>
</html>
